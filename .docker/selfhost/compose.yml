name: affine

services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine_server
    restart: unless-stopped
    ports:
      - "3010:3010"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      smtp-relay:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine@postgres:5432/affine
      DEPLOYMENT_TYPE: selfhosted
      MAILER_HOST: smtp-relay
      MAILER_PORT: "25"
      MAILER_SERVERNAME: "${AFFINE_MAILER_SERVERNAME}"
      MAILER_SENDER: "${SMTP_RELAY_SEND_FROM}"
      MAILER_SECURE: "false"
    networks:
      - affine

  affine_migration:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine_migration_job
    restart: "no"
    command:
      - sh
      - -c
      - node ./scripts/self-host-predeploy.js
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine@postgres:5432/affine
      DEPLOYMENT_TYPE: selfhosted
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - affine

  redis:
    image: redis:7-alpine
    container_name: affine_redis
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --raw
        - incr
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - affine

  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - affine
        - -d
        - affine
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - affine

  smtp-relay:
    image: ghcr.io/dmitaj/microsoft-365-smtp-relay:latest
    container_name: affine_smtp_relay
    restart: unless-stopped
    environment:
      Graph_TenantId: "${MICROSOFT_TENANT_ID}"
      Graph_ClientId: "${MICROSOFT_CLIENT_ID}"
      Graph_ClientSecret: "${MICROSOFT_CLIENT_SECRET}"
      SendFrom: "${SMTP_RELAY_SEND_FROM}"
      Smtp_Host: "0.0.0.0"
      Smtp_Port: "25"
      LogLevel: "INFO"
      LogPath: "/var/log/smtp-relay"
    volumes:
      - ./data/smtp-relay-logs:/var/log/smtp-relay
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - python healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - affine

networks:
  affine:
    name: affine
    driver: bridge
